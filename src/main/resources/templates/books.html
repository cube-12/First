<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>图书检索 - 图书馆管理系统</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--primary:#1a237e;--primary-light:#283593;--primary-dark:#0d1b5e;--accent:#ff6f00;--bg:#f0f2f5;--card-shadow:0 2px 8px rgba(0,0,0,0.06);--radius:10px}
*{box-sizing:border-box}body{background:var(--bg);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh;margin:0;padding:0;display:flex}
.sidebar{width:240px;min-height:100vh;background:linear-gradient(180deg,#1a237e,#0d1b5e);color:#fff;position:fixed;left:0;top:0;display:flex;flex-direction:column;box-shadow:2px 0 12px rgba(0,0,0,0.15);z-index:1000}
.sidebar-brand{padding:20px;font-size:1.1rem;font-weight:700;border-bottom:1px solid rgba(255,255,255,0.1);text-align:center}.sidebar-brand i{font-size:1.5rem;display:block;margin-bottom:6px}
.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto}.sidebar-nav .nav-section{padding:8px 20px 4px;font-size:0.75rem;text-transform:uppercase;opacity:0.5;letter-spacing:1px}
.sidebar-nav a{display:flex;align-items:center;padding:10px 20px;color:rgba(255,255,255,0.75);text-decoration:none;transition:all .2s;font-size:0.92rem}
.sidebar-nav a:hover{background:rgba(255,255,255,0.1);color:#fff}.sidebar-nav a.active{background:rgba(255,255,255,0.15);color:#fff;border-right:3px solid var(--accent)}
.sidebar-nav a i{width:22px;margin-right:10px;text-align:center;font-size:1rem}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);font-size:0.85rem}
.main-content{margin-left:240px;flex:1;min-height:100vh;padding:24px 28px;width:calc(100% - 240px)}
.page-title{margin-bottom:24px}.page-title h1{font-weight:700;color:var(--primary);margin:0;font-size:1.6rem}.page-title p{color:#666;margin:4px 0 0}
.card-custom{background:#fff;border:none;border-radius:var(--radius);box-shadow:var(--card-shadow)}
.table-custom{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--card-shadow)}
.table-custom thead{background:var(--primary);color:#fff}.table-custom th{font-weight:600;padding:12px 16px;border:none;font-size:0.9rem}.table-custom td{padding:12px 16px;vertical-align:middle}
.badge-available{background:#e8f5e9;color:#2e7d32;padding:4px 12px;border-radius:20px;font-weight:600;font-size:0.8rem}
.badge-unavailable{background:#ffebee;color:#c62828;padding:4px 12px;border-radius:20px;font-weight:600;font-size:0.8rem}
.badge-user{background:#e3f2fd;color:#1565c0;padding:4px 12px;border-radius:20px;font-weight:600;font-size:0.8rem}
.btn-action{padding:4px 12px;font-size:0.82rem;border-radius:6px;margin:0 2px}
.sidebar-card{background:#fff;border-radius:var(--radius);box-shadow:var(--card-shadow);padding:16px;margin-bottom:16px}
.sidebar-card h6{color:var(--primary);font-weight:700;border-bottom:2px solid var(--primary);padding-bottom:8px;margin-bottom:12px;font-size:0.9rem}
</style></head>
<body>
<div class="sidebar">
<div class="sidebar-brand"><i class="fas fa-book-open"></i><span>图书馆管理系统</span></div>
<div class="sidebar-nav">
<div class="nav-section">导航</div><a href="/"><i class="fas fa-home"></i><span>首页</span></a>
<div class="nav-section">图书服务</div>
<a href="/books" class="active"><i class="fas fa-search"></i><span>图书检索</span></a>
<a href="/books/recommend"><i class="fas fa-plus-circle"></i><span>读者荐购</span></a>
<a href="/books/my-recommendations"><i class="fas fa-list"></i><span>荐购记录</span></a>
<div class="nav-section">个人</div><a href="/user/center"><i class="fas fa-user-circle"></i><span>个人中心</span></a>
</div>
<div class="sidebar-footer" th:if="${username!=null}">
<div style="display:flex;align-items:center;justify-content:space-between">
<span><i class="fas fa-user me-1"></i><span th:text="${username}">用户</span></span>
<form th:action="@{/logout}" method="post" class="m-0"><button type="submit" class="btn btn-sm" style="background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:6px"><i class="fas fa-sign-out-alt"></i></button></form>
</div></div></div>
<div class="main-content">
<div class="page-title"><h1><i class="fas fa-search me-2"></i>图书检索</h1><p>多维度搜索、分类浏览、新书通报、热门排行</p></div>
<div class="row">
<div class="col-lg-3">
<div class="sidebar-card"><h6>分类浏览</h6><div class="d-flex flex-wrap gap-1"><a href="/books" class="btn btn-sm btn-outline-primary">全部</a><a th:each="c:${categories}" th:href="@{'/books?category='+${c}}" class="btn btn-sm btn-outline-secondary" th:text="${c}">分类</a></div></div>
<div class="sidebar-card"><h6><i class="fas fa-clock me-1"></i>新书通报</h6><div th:each="b:${newBooks}" class="mb-2 pb-2 border-bottom"><a th:href="@{'/books/detail/'+${b.id}}" th:text="${b.title}" style="font-size:0.9rem">书名</a><small class="d-block text-muted" th:text="${b.author}">作者</small></div></div>
<div class="sidebar-card"><h6><i class="fas fa-star me-1"></i>热门排行</h6><div th:each="b,i:${popularBooks}" class="mb-2 pb-2 border-bottom"><small class="text-muted" th:text="${i.index+1}+'. '">1.</small><a th:href="@{'/books/detail/'+${b.id}}" th:text="${b.title}" style="font-size:0.9rem">书名</a></div></div>
</div>
<div class="col-lg-9">
<div class="card-custom p-3 mb-3"><form method="get" action="/books" class="row g-2"><div class="col-md-3"><select name="field" class="form-select"><option value="">全部字段</option><option value="title">题名</option><option value="author">作者</option><option value="isbn">ISBN</option><option value="category">分类</option></select></div><div class="col-md-7"><input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="输入关键词..."></div><div class="col-md-2"><button type="submit" class="btn w-100" style="background:var(--accent);color:#fff;border:none"><i class="fas fa-search"></i> 搜索</button></div></form></div>
<p class="text-muted" th:if="${keyword}" th:text="'搜索 "'+${keyword}+'" 共 '+${#lists.size(books)}+' 条'"></p>
<div class="table-responsive table-custom"><table class="table table-hover mb-0"><thead><tr><th>书名</th><th>作者</th><th>分类</th><th>ISBN</th><th>可借</th><th>操作</th></tr></thead>
<tbody><tr th:each="book:${books}"><td><a th:href="@{'/books/detail/'+${book.id}}" th:text="${book.title}" class="fw-bold"></a></td><td th:text="${book.author}">作者</td><td><span class="badge-user" th:text="${book.category}">分类</span></td><td><code th:text="${book.isbn}">ISBN</code></td><td><span th:if="${book.available>0}" class="badge-available" th:text="${book.available}+'/'+${book.quantity}">可借</span><span th:unless="${book.available>0}" class="badge-unavailable">已借完</span></td><td><a th:href="@{'/books/detail/'+${book.id}}" class="btn btn-sm btn-outline-primary btn-action"><i class="fas fa-info-circle"></i> 详情</a></td></tr></tbody></table></div>
</div></div></div>
<footer style="margin-top:40px;padding:16px 0;text-align:center;color:#999;font-size:0.85rem;border-top:1px solid #e0e0e0"><p>&copy; 2026 图书馆管理系统</p></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
