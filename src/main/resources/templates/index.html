<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>图书管理系统首页</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body, html {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Roboto", sans-serif;
      background: #e8ecf2;
    }
    .hero-bg {
      min-height: 100vh;
      background: linear-gradient(120deg, #e8ecf2 0%, #dde3ed 40%, #e1e5ee 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .frosted-card {
      background: rgba(255,255,255,0.92);
      padding: 64px 48px 44px 48px;
      border-radius: 30px;
      box-shadow: 0 12px 48px 0 rgba(49,94,212,0.11), 0 1.5px 12px 0 #d1d8ec88;
      text-align: center;
      max-width: 520px;
      margin: 0 auto;
      position: relative;
      backdrop-filter: blur(6px);
      border: 1.5px solid #e6eaf3;
      transition: box-shadow 0.3s;
      animation: cardIn 0.8s cubic-bezier(.68,-0.55,.27,1.55);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(60px) scale(.95);}
      to   { opacity: 1; transform: none;}
    }
    .frosted-card:hover {
      box-shadow: 0 20px 60px 0 rgba(49,94,212,0.18), 0 2px 18px 0 #d1d8ecaa;
    }
    .main-title {
      font-size: 2.55rem;
      color: #273a55;
      font-weight: 900;
      margin-bottom: 18px;
      letter-spacing: 2.2px;
      text-shadow: 0 10px 32px #b4c9e4cc;
      opacity: 0;
      animation: fadeInText 1.2s 0.4s forwards;
    }
    .main-title .highlight {
      background: linear-gradient(87deg, #5a6cae 20%, #95a7ce 70%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-fill-color: transparent;
      font-size: 2.6rem;
    }
    @keyframes fadeInText {
      from { opacity: 0; transform: translateY(26px);}
      to   { opacity: 1; transform: none;}
    }
    .main-desc {
      font-size: 1.17rem;
      color: #4b5b75;
      margin-bottom: 38px;
      line-height: 1.7;
      font-weight: 500;
      letter-spacing: .4px;
      opacity: 0;
      animation: fadeInText 1.2s 0.7s forwards;
    }
    .main-btn {
      display: inline-block;
      width: 130px;
      margin: 0 18px;
      font-size: 1.13rem;
      padding: 13px 0;
      border-radius: 11px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      box-shadow: 0 2px 12px #b3c2df44;
      transition: box-shadow 0.18s, transform 0.11s, background 0.18s, color 0.18s;
      opacity: 0;
      animation: btnPop 0.9s 1.2s forwards;
    }
    .main-btn.login {
      background: linear-gradient(92deg,#5563a0 55%,#7ba3db 100%);
      color: #fff;
    }
    .main-btn.login:hover {
      background: linear-gradient(92deg,#313e6d 60%,#95b5e8 100%);
      color: #fff;
      transform: translateY(-2px) scale(1.08) rotate(-2deg);
      box-shadow: 0 8px 28px #a0c0f0b2;
    }
    .main-btn.register {
      background: linear-gradient(93deg, #e8eaf4 0%, #a3b9db 100%);
      color: #41507c;
      border: 1px solid #bfcbe1;
      animation-delay: 1.3s;
    }
    .main-btn.register:hover {
      background: linear-gradient(93deg, #f6f7fa 0%, #c2d2ec 100%);
      color: #2f3d5b;
      transform: translateY(-2px) scale(1.08) rotate(2deg);
    }
    @keyframes btnPop {
      0%   { opacity: 0; transform: scale(.85);}
      60%  { opacity: 1; transform: scale(1.15);}
      100% { opacity: 1; transform: none;}
    }
    .footer {
      margin-top: 40px;
      color: #b2bac9;
      font-size: 1.01rem;
      letter-spacing: 1.6px;
      z-index: 1;
      opacity: 0;
      animation: fadeInText 1s 1.7s forwards;
    }
    .book-graphic {
      width: 85px;
      margin-bottom: 22px;
      filter: drop-shadow(0 6px 18px #b4d2e3cc);
      transform: scale(1) rotate(-8deg);
      animation: bookFloat 3s 0.5s ease-in-out infinite alternate;
    }
    @keyframes bookFloat {
      0%   { transform: scale(1) rotate(-8deg) translateY(0px);}
      65%  { transform: scale(1.07) rotate(-2deg) translateY(-12px);}
      100% { transform: scale(1.04) rotate(-5deg) translateY(-5px);}
    }
    .decor-circle {
      position: absolute;
      border-radius: 50%;
      opacity: 0.49;
      filter: blur(16px);
      z-index: 0;
      pointer-events: none;
      animation: decorFloat 5.6s ease-in-out infinite alternate;
    }
    .decor1 {
      width: 340px; height: 340px;
      left: -130px;
      top: -70px;
      background: radial-gradient(circle at 70% 25%, #b6c7e8 0%, #e6eaf3 85%);
      animation-delay: 0.6s;
    }
    .decor2 {
      width: 170px; height: 170px;
      right: -50px;
      top: 60px;
      background: radial-gradient(circle at 30% 60%, #c3e4f3 0%, #f6f7fa 100%);
      animation-delay: 1.2s;
    }
    .decor3 {
      width: 220px; height: 220px;
      left: 60%;
      bottom: -80px;
      background: radial-gradient(circle at 60% 40%, #c9d3e2 0%, #e8ecf2 90%);
      animation-delay: 2s;
    }
    @keyframes decorFloat {
      0%   { transform: scale(1) translateY(0px);}
      100% { transform: scale(1.06) translateY(18px);}
    }
    @media (max-width: 600px) {
      .frosted-card { padding: 22px 4vw 14px 4vw; max-width: 99vw;}
      .main-title { font-size: 1.25rem; }
      .main-title .highlight { font-size: 1.32rem; }
      .main-desc { font-size: .96rem; }
      .main-btn { font-size: .97rem; width: 44vw; min-width: 98px;}
    }
  </style>
</head>
<body>
<div class="hero-bg">
  <div class="decor-circle decor1"></div>
  <div class="decor-circle decor2"></div>
  <div class="decor-circle decor3"></div>
  <div class="frosted-card">
    <svg class="book-graphic" viewBox="0 0 80 80" fill="none">
      <rect x="10" y="12" width="60" height="56" rx="10" fill="#b4c9e4"/>
      <rect x="18" y="21" width="44" height="38" rx="7" fill="#fff" stroke="#5a6cae" stroke-width="2"/>
      <rect x="22" y="27" width="36" height="4" rx="2" fill="#dbe5f5"/>
      <rect x="22" y="36" width="36" height="4" rx="2" fill="#dbe5f5"/>
      <rect x="22" y="45" width="21" height="4" rx="2" fill="#dbe5f5"/>
    </svg>
    <div class="main-title">
      <span class="highlight">图书管理系统</span><br>
      智能 · 精致 · 安全
    </div>
    <div class="main-desc">
      尊享高端体验，轻松管理图书、借阅与归还。<br>
      登录或注册，开启智慧阅读新生活。
    </div>
    <a th:href="@{/login}" class="main-btn login">登录</a>
    <a th:href="@{/register}" class="main-btn register">注册</a>
    <div class="footer">
      &copy; 2025 图书管理系统 | cube-12
    </div>
  </div>
</div>
</body>
</html>
