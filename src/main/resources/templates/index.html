<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>首页 - 图书馆管理系统</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>
:root{--primary:#1a237e;--primary-light:#283593;--primary-dark:#0d1b5e;--accent:#ff6f00;--bg:#f0f2f5;--card-shadow:0 2px 8px rgba(0,0,0,0.06);--radius:10px;}
*{box-sizing:border-box}body{background:var(--bg);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh;margin:0;padding:0;display:flex}
.sidebar{width:240px;min-height:100vh;background:linear-gradient(180deg,#1a237e,#0d1b5e);color:#fff;position:fixed;left:0;top:0;display:flex;flex-direction:column;box-shadow:2px 0 12px rgba(0,0,0,0.15);z-index:1000}
.sidebar-brand{padding:20px;font-size:1.1rem;font-weight:700;border-bottom:1px solid rgba(255,255,255,0.1);text-align:center}
.sidebar-brand i{font-size:1.5rem;display:block;margin-bottom:6px}
.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto}
.sidebar-nav .nav-section{padding:8px 20px 4px;font-size:0.75rem;text-transform:uppercase;opacity:0.5;letter-spacing:1px}
.sidebar-nav a{display:flex;align-items:center;padding:10px 20px;color:rgba(255,255,255,0.75);text-decoration:none;transition:all .2s;font-size:0.92rem}
.sidebar-nav a:hover{background:rgba(255,255,255,0.1);color:#fff}
.sidebar-nav a.active{background:rgba(255,255,255,0.15);color:#fff;border-right:3px solid var(--accent)}
.sidebar-nav a i{width:22px;margin-right:10px;text-align:center;font-size:1rem}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);font-size:0.85rem}
.main-content{margin-left:240px;flex:1;min-height:100vh;padding:24px 28px;width:calc(100% - 240px)}
.page-title{margin-bottom:24px}
.page-title h1{font-weight:700;color:var(--primary);margin:0;font-size:1.6rem}
.page-title p{color:#666;margin:4px 0 0}
.card-custom{background:#fff;border:none;border-radius:var(--radius);box-shadow:var(--card-shadow)}
.table-custom{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--card-shadow)}
.table-custom thead{background:var(--primary);color:#fff}
.table-custom th{font-weight:600;padding:12px 16px;border:none;font-size:0.9rem}
.table-custom td{padding:12px 16px;vertical-align:middle}
.badge-available{background:#e8f5e9;color:#2e7d32;padding:4px 12px;border-radius:20px;font-weight:600;font-size:0.8rem}
.badge-unavailable{background:#ffebee;color:#c62828;padding:4px 12px;border-radius:20px;font-weight:600;font-size:0.8rem}
.badge-admin{background:#fff3e0;color:#e65100;padding:4px 12px;border-radius:20px;font-weight:600;font-size:0.8rem}
.badge-user{background:#e3f2fd;color:#1565c0;padding:4px 12px;border-radius:20px;font-weight:600;font-size:0.8rem}
.badge-pending{background:#fff8e1;color:#f57f17;padding:4px 12px;border-radius:20px;font-weight:600;font-size:0.8rem}
.badge-approved{background:#e8f5e9;color:#2e7d32;padding:4px 12px;border-radius:20px;font-weight:600;font-size:0.8rem}
.badge-rejected{background:#ffebee;color:#c62828;padding:4px 12px;border-radius:20px;font-weight:600;font-size:0.8rem}
.btn-action{padding:4px 12px;font-size:0.82rem;border-radius:6px;margin:0 2px}
.sidebar-card{background:#fff;border-radius:var(--radius);box-shadow:var(--card-shadow);padding:16px;margin-bottom:16px}
.sidebar-card h6{color:var(--primary);font-weight:700;border-bottom:2px solid var(--primary);padding-bottom:8px;margin-bottom:12px;font-size:0.9rem}
@media(max-width:768px){.sidebar{width:60px}.sidebar-brand span,.sidebar-nav a span,.sidebar-nav .nav-section,.sidebar-footer{display:none}.sidebar-nav a{justify-content:center;padding:12px}.sidebar-nav a i{margin:0}.main-content{margin-left:60px;padding:16px;width:calc(100% - 60px)}}
</style></head><body><div class="sidebar">
    <div class="sidebar-brand"><i class="fas fa-book-open"></i><span>图书馆管理系统</span></div>
    <div class="sidebar-nav">
        <div class="nav-section">导航</div>
        <a href="/" th:classappend="${currentPage} == 'home' ? 'active'"><i class="fas fa-home"></i><span>首页</span></a>        <a href="/user/login"><i class="fas fa-sign-in-alt"></i><span>登录</span></a>
        <a href="/user/register"><i class="fas fa-user-plus"></i><span>注册</span></a>    </div>
    <div class="sidebar-footer" th:if="${username != null}">
        <div style="display:flex;align-items:center;justify-content:space-between">
            <span><i class="fas fa-user me-1"></i><span><span th:text="${username}">用户</span></span></span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm" style="background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:6px"><i class="fas fa-sign-out-alt"></i></button>
            </form>
        </div>
    </div>
</div><div class="main-content"><div class="page-title"><h1>欢迎来到图书馆管理系统</h1><p>高效管理图书资源，提供便捷的借阅服务</p></div>
<div class="row">
    <div class="col-md-4 mb-3"><div class="card-custom p-4 text-center"><div style="font-size:2.5rem;color:var(--primary);margin-bottom:8px"><i class="fas fa-book"></i></div><h3>1,248</h3><p class="text-muted mb-0">馆藏图书</p></div></div>
    <div class="col-md-4 mb-3"><div class="card-custom p-4 text-center"><div style="font-size:2.5rem;color:var(--primary);margin-bottom:8px"><i class="fas fa-users"></i></div><h3>5,632</h3><p class="text-muted mb-0">注册用户</p></div></div>
    <div class="col-md-4 mb-3"><div class="card-custom p-4 text-center"><div style="font-size:2.5rem;color:var(--primary);margin-bottom:8px"><i class="fas fa-exchange-alt"></i></div><h3>28,417</h3><p class="text-muted mb-0">借阅记录</p></div></div>
</div>
<h4 class="mb-3">系统功能</h4>
<div class="row">
    <div class="col-md-4 mb-3"><div class="card-custom h-100 p-3"><h5><i class="fas fa-book-open text-primary me-2"></i>图书管理</h5><p class="text-muted">浏览、搜索馆藏图书，查看详细信息和可借状态。</p></div></div>
    <div class="col-md-4 mb-3"><div class="card-custom h-100 p-3"><h5><i class="fas fa-user-plus text-primary me-2"></i>读者服务</h5><p class="text-muted">读者荐购、借阅记录、个人中心一站式服务。</p></div></div>
    <div class="col-md-4 mb-3"><div class="card-custom h-100 p-3"><h5><i class="fas fa-shield-alt text-primary me-2"></i>管理后台</h5><p class="text-muted">管理员可对图书、用户进行统一管理。</p></div></div>
</div>
<div class="mt-4 d-flex gap-2">
    <a href="/user/login" class="btn" style="background:var(--accent);color:#fff;border:none;font-weight:600">开始使用</a>
    <a href="/user/register" class="btn btn-outline-primary">注册账户</a>
</div><footer style="margin-top:40px;padding:16px 0;text-align:center;color:#999;font-size:0.85rem;border-top:1px solid #e0e0e0"><p class="mb-0">&copy; 2026 图书馆管理系统</p></footer></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script></body></html>
