<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- 公共 CSS -->
<th:block th:fragment="css">
<style>
:root {
    --primary:#1a237e; --primary-light:#283593; --primary-dark:#0d1b5e;
    --accent:#ff6f00; --bg:#f0f2f5; --sidebar-bg:#1a237e;
    --card-shadow:0 2px 8px rgba(0,0,0,0.06); --radius:10px;
}
* { box-sizing:border-box; }
body {
    background:var(--bg); font-family:"Segoe UI",system-ui,sans-serif;
    min-height:100vh; margin:0; padding:0;
    display:flex;
}
/* 侧边栏 */
.sidebar {
    width:240px; min-height:100vh;
    background:linear-gradient(180deg,#1a237e,#0d1b5e);
    color:#fff; position:fixed; left:0; top:0;
    display:flex; flex-direction:column;
    box-shadow:2px 0 12px rgba(0,0,0,0.15);
    z-index:1000; transition:all .3s;
}
.sidebar-brand {
    padding:20px; font-size:1.1rem; font-weight:700;
    border-bottom:1px solid rgba(255,255,255,0.1);
    text-align:center;
}
.sidebar-brand i { font-size:1.5rem; display:block; margin-bottom:6px; }
.sidebar-nav { flex:1; padding:12px 0; overflow-y:auto; }
.sidebar-nav .nav-section { padding:8px 20px 4px; font-size:0.75rem; text-transform:uppercase; opacity:0.5; letter-spacing:1px; }
.sidebar-nav a {
    display:flex; align-items:center; padding:10px 20px;
    color:rgba(255,255,255,0.75); text-decoration:none;
    transition:all .2s; font-size:0.92rem;
}
.sidebar-nav a:hover { background:rgba(255,255,255,0.1); color:#fff; }
.sidebar-nav a.active { background:rgba(255,255,255,0.15); color:#fff; border-right:3px solid var(--accent); }
.sidebar-nav a i { width:22px; margin-right:10px; text-align:center; font-size:1rem; }
.sidebar-footer {
    padding:16px 20px; border-top:1px solid rgba(255,255,255,0.1);
    font-size:0.85rem;
}
/* 主内容 */
.main-content { margin-left:240px; flex:1; min-height:100vh; padding:24px 28px; width:calc(100% - 240px); }
.page-title { margin-bottom:24px; }
.page-title h1 { font-weight:700; color:var(--primary); margin:0; font-size:1.6rem; }
.page-title p { color:#666; margin:4px 0 0; }
/* 组件 */
.card-custom { background:#fff; border:none; border-radius:var(--radius); box-shadow:var(--card-shadow); }
.table-custom { background:#fff; border-radius:var(--radius); overflow:hidden; box-shadow:var(--card-shadow); }
.table-custom thead { background:var(--primary); color:#fff; }
.table-custom th { font-weight:600; padding:12px 16px; border:none; font-size:0.9rem; }
.table-custom td { padding:12px 16px; vertical-align:middle; }
.badge-available { background:#e8f5e9; color:#2e7d32; padding:4px 12px; border-radius:20px; font-weight:600; font-size:0.8rem; }
.badge-unavailable { background:#ffebee; color:#c62828; padding:4px 12px; border-radius:20px; font-weight:600; font-size:0.8rem; }
.badge-admin { background:#fff3e0; color:#e65100; padding:4px 12px; border-radius:20px; font-weight:600; font-size:0.8rem; }
.badge-user { background:#e3f2fd; color:#1565c0; padding:4px 12px; border-radius:20px; font-weight:600; font-size:0.8rem; }
.badge-pending { background:#fff8e1; color:#f57f17; padding:4px 12px; border-radius:20px; font-weight:600; font-size:0.8rem; }
.badge-approved { background:#e8f5e9; color:#2e7d32; padding:4px 12px; border-radius:20px; font-weight:600; font-size:0.8rem; }
.badge-rejected { background:#ffebee; color:#c62828; padding:4px 12px; border-radius:20px; font-weight:600; font-size:0.8rem; }
.btn-action { padding:4px 12px; font-size:0.82rem; border-radius:6px; margin:0 2px; }
.sidebar-card { background:#fff; border-radius:var(--radius); box-shadow:var(--card-shadow); padding:16px; margin-bottom:16px; }
.sidebar-card h6 { color:var(--primary); font-weight:700; border-bottom:2px solid var(--primary); padding-bottom:8px; margin-bottom:12px; font-size:0.9rem; }
@media(max-width:768px){
    .sidebar { width:60px; }
    .sidebar-brand span, .sidebar-nav a span, .sidebar-nav .nav-section, .sidebar-footer { display:none; }
    .sidebar-nav a { justify-content:center; padding:12px; }
    .sidebar-nav a i { margin:0; }
    .main-content { margin-left:60px; padding:16px; width:calc(100% - 60px); }
}
</style>
</th:block>

<!-- 侧边栏 -->
<th:block th:fragment="sidebar(role,username)">
<div class="sidebar">
    <div class="sidebar-brand">
        <i class="fas fa-book-open"></i>
        <span>图书馆管理系统</span>
    </div>
    <div class="sidebar-nav">
        <div class="nav-section">导航</div>
        <a href="/" th:classappend="${currentPage == 'home'} ? 'active'"><i class="fas fa-home"></i><span>首页</span></a>

        <!-- 普通用户菜单 -->
        <th:block th:if="${role == null}">
            <a href="/user/login"><i class="fas fa-sign-in-alt"></i><span>登录</span></a>
            <a href="/user/register"><i class="fas fa-user-plus"></i><span>注册</span></a>
        </th:block>

        <th:block th:if="${role == 'USER'}">
            <div class="nav-section">图书服务</div>
            <a href="/books" th:classappend="${#strings.startsWith(currentPage, 'books')} ? 'active'"><i class="fas fa-search"></i><span>图书检索</span></a>
            <a href="/books/recommend" th:classappend="${currentPage == 'recommend'} ? 'active'"><i class="fas fa-plus-circle"></i><span>读者荐购</span></a>
            <a href="/books/my-recommendations" th:classappend="${currentPage == 'myrec'} ? 'active'"><i class="fas fa-list"></i><span>荐购记录</span></a>
            <div class="nav-section">个人</div>
            <a href="/user/center" th:classappend="${currentPage == 'center'} ? 'active'"><i class="fas fa-user-circle"></i><span>个人中心</span></a>
        </th:block>

        <!-- 管理员菜单 -->
        <th:block th:if="${role == 'ADMIN'}">
            <div class="nav-section">图书管理</div>
            <a href="/admin/books" th:classappend="${currentPage == 'admin-books'} ? 'active'"><i class="fas fa-book"></i><span>图书列表</span></a>
            <a href="/admin/books/add" th:classappend="${currentPage == 'admin-addbook'} ? 'active'"><i class="fas fa-plus"></i><span>添加图书</span></a>
            <div class="nav-section">系统管理</div>
            <a href="/admin/users" th:classappend="${currentPage == 'admin-users'} ? 'active'"><i class="fas fa-users-cog"></i><span>用户管理</span></a>
            <a href="/admin/recommendations" th:classappend="${currentPage == 'admin-recs'} ? 'active'"><i class="fas fa-shopping-cart"></i><span>荐购管理</span></a>
        </th:block>
    </div>
    <div class="sidebar-footer" th:if="${username != null}">
        <div style="display:flex;align-items:center;justify-content:space-between">
            <span><i class="fas fa-user me-1"></i><span th:text="${username}">用户</span></span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm" style="background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:6px"><i class="fas fa-sign-out-alt"></i></button>
            </form>
        </div>
    </div>
</div>
</th:block>

<!-- 页脚 -->
<footer th:fragment="footer" style="margin-top:40px;padding:16px 0;text-align:center;color:#999;font-size:0.85rem;border-top:1px solid #e0e0e0">
    <p class="mb-0">&copy; 2026 图书馆管理系统 &mdash; Spring Boot + Thymeleaf</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</html>
