<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>图书列表 - 图书管理系统</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(120deg, #e8ecf2 0%, #dde3ed 40%, #e1e5ee 100%);
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Roboto", sans-serif;
        }
        .container {
            max-width: 1050px;
            margin: 46px auto 32px auto;
            background: rgba(255,255,255,0.96);
            border-radius: 28px;
            box-shadow: 0 12px 48px 0 rgba(49,94,212,0.11);
            padding: 36px 32px 32px 32px;
            backdrop-filter: blur(6px);
            border: 1.5px solid #e6eaf3;
            animation: cardIn 0.7s cubic-bezier(.68,-0.55,.27,1.55);
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(60px) scale(.97);}
            to   { opacity: 1; transform: none;}
        }
        .page-title {
            font-size: 2.3rem;
            color: #273a55;
            font-weight: 900;
            margin-bottom: 26px;
            text-align: center;
            letter-spacing: 1.3px;
            text-shadow: 0 8px 22px #b4c9e4a3;
        }
        .book-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            margin-top: 18px;
            font-size: 1.08rem;
        }
        .book-table th, .book-table td {
            padding: 13px 10px;
            background: #f7fafc;
            border: none;
        }
        .book-table th {
            background: #e8ecf2;
            color: #315ed4;
            font-weight: 700;
            border-radius: 8px 8px 0 0;
        }
        .book-table tbody tr {
            box-shadow: 0 2px 16px #e5eaf555;
            border-radius: 10px;
            transition: box-shadow 0.18s;
        }
        .book-table tbody tr:hover td {
            background: #e6eefb;
            box-shadow: 0 8px 26px #b4d2e344;
        }
        .action-btn {
            padding: 7px 18px;
            border: none;
            border-radius: 7px;
            color: #fff;
            background: linear-gradient(90deg, #43a047 60%, #79d18e 100%);
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.18s, transform 0.11s;
            outline: none;
            margin-right: 7px;
            margin-bottom: 2px;
        }
        .action-btn:hover {
            background: linear-gradient(90deg, #2e7031 60%, #43a047 100%);
            transform: translateY(-2px) scale(1.06);
        }
        .edit-btn {
            background: linear-gradient(90deg, #5563a0 55%, #7ba3db 100%);
        }
        .edit-btn:hover {
            background: linear-gradient(92deg,#313e6d 60%,#95b5e8 100%);
        }
        .delete-btn {
            background: linear-gradient(90deg, #d32f2f 60%, #f46d6d 100%);
        }
        .delete-btn:hover {
            background: linear-gradient(90deg, #a12a2a 60%, #d32f2f 100%);
        }
        .add-btn {
            background: linear-gradient(90deg, #315ed4 60%, #5dbdec 100%);
            margin-bottom: 18px;
            font-size: 1.06rem;
        }
        .add-btn:hover {
            background: linear-gradient(90deg, #153c88 60%, #2b98d1 100%);
        }
        .back-btn {
            background: linear-gradient(90deg, #8e95a5 60%, #c9d1e8 100%);
            color: #314060;
            font-weight: 600;
            margin-left: 7px;
            border: none;
            border-radius: 7px;
            padding: 7px 18px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.18s, color 0.18s, transform 0.11s;
            box-shadow: 0 1.5px 8px #b8bddb29;
            text-decoration: none;
            display: inline-block;
        }
        .back-btn:hover {
            background: linear-gradient(90deg, #6a7491 60%, #b2bad8 100%);
            color: #fff;
            transform: translateY(-2px) scale(1.06);
            text-decoration: none;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .form-error {
            background:#ffeaea;
            color:#d32f2f;
            padding:10px 0;
            margin-bottom:15px;
            border-radius:7px;
            border:1.2px solid #fbb;
            text-align:center;
            font-weight:600;
        }
        @media (max-width: 900px) {
            .container { padding: 10px 2vw; }
            .page-title { font-size: 1.3rem; }
            .book-table th, .book-table td { padding: 10px 4px; font-size: .98rem; }
        }
        @media (max-width: 600px) {
            .container { padding: 6px 2vw; }
            .page-title { font-size: 1.08rem; }
            .top-bar { flex-direction: column; align-items: stretch; }
            .book-table th, .book-table td { padding: 8px 2px; font-size: .92rem; }
            .btn-group { flex-direction: column; gap: 6px;}
        }
    </style>
</head>
<body>
<div class="container">
    <div class="page-title">📚 图书列表</div>
    <div th:if="${errorMsg}" class="form-error">
        <span th:text="${errorMsg}"></span>
    </div>
    <div class="top-bar">
        <div class="btn-group">
            <a th:href="@{/books/add}" class="action-btn add-btn">+ 添加图书</a>
            <a th:href="@{/}" class="action-btn add-btn">返回主页</a>
        </div>
    </div>
    <table class="book-table">
        <thead>
        <tr>
            <th>编号</th>
            <th>书名</th>
            <th>作者</th>
            <th>出版社</th>
            <th>库存</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.id}">1</td>
            <td th:text="${book.title}">活着</td>
            <td th:text="${book.author}">余华</td>
            <td th:text="${book.publisher}">作家出版社</td>
            <td th:text="${book.stock}">10</td>
            <td>
                <a th:href="@{'/books/edit/' + ${book.id}}" class="action-btn edit-btn">编辑</a>
                <a th:href="@{'/books/delete/' + ${book.id}}" class="action-btn delete-btn" onclick="return confirm('确定要删除这本书吗？')">删除</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(books)}">
            <td colspan="6" style="text-align:center;color:#b0b8c7;padding:30px 0;">暂无图书</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
