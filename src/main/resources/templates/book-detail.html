<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>图书详情 - 图书馆管理系统</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>:root{--primary:#1a237e;--primary-light:#283593;--primary-dark:#0d1b5e;--accent:#ff6f00;--bg:#f0f2f5;--card-shadow:0 2px 8px rgba(0,0,0,0.06);--radius:10px}*{box-sizing:border-box}body{background:var(--bg);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh;margin:0;padding:0;display:flex}.sidebar{width:240px;min-height:100vh;background:linear-gradient(180deg,#1a237e,#0d1b5e);color:#fff;position:fixed;left:0;top:0;display:flex;flex-direction:column;box-shadow:2px 0 12px rgba(0,0,0,0.15);z-index:1000}.sidebar-brand{padding:20px;font-size:1.1rem;font-weight:700;border-bottom:1px solid rgba(255,255,255,0.1);text-align:center}.sidebar-brand i{font-size:1.5rem;display:block;margin-bottom:6px}.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto}.sidebar-nav .nav-section{padding:8px 20px 4px;font-size:0.75rem;text-transform:uppercase;opacity:0.5;letter-spacing:1px}.sidebar-nav a{display:flex;align-items:center;padding:10px 20px;color:rgba(255,255,255,0.75);text-decoration:none;transition:all .2s;font-size:0.92rem}.sidebar-nav a:hover{background:rgba(255,255,255,0.1);color:#fff}.sidebar-nav a.active{background:rgba(255,255,255,0.15);color:#fff;border-right:3px solid var(--accent)}.sidebar-nav a i{width:22px;margin-right:10px;text-align:center;font-size:1rem}.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);font-size:0.85rem}.main-content{margin-left:240px;flex:1;min-height:100vh;padding:24px 28px;width:calc(100% - 240px)}.page-title{margin-bottom:24px}.page-title h1{font-weight:700;color:var(--primary);margin:0;font-size:1.6rem}.card-custom{background:#fff;border:none;border-radius:var(--radius);box-shadow:var(--card-shadow)}.badge-available{background:#e8f5e9;color:#2e7d32;padding:4px 12px;border-radius:20px;font-weight:600;font-size:0.85rem}.badge-unavailable{background:#ffebee;color:#c62828;padding:4px 12px;border-radius:20px;font-weight:600;font-size:0.85rem}</style></head>
<body>
<div class="sidebar"><div class="sidebar-brand"><i class="fas fa-book-open"></i><span>图书馆管理系统</span></div><div class="sidebar-nav"><div class="nav-section">导航</div><a href="/"><i class="fas fa-home"></i><span>首页</span></a><div class="nav-section">图书服务</div><a href="/books" class="active"><i class="fas fa-search"></i><span>图书检索</span></a><a href="/books/recommend"><i class="fas fa-plus-circle"></i><span>读者荐购</span></a><a href="/books/my-recommendations"><i class="fas fa-list"></i><span>荐购记录</span></a><div class="nav-section">个人</div><a href="/user/center"><i class="fas fa-user-circle"></i><span>个人中心</span></a></div><div class="sidebar-footer" th:if="${username!=null}"><div style="display:flex;align-items:center;justify-content:space-between"><span><i class="fas fa-user me-1"></i><span th:text="${username}">用户</span></span><form th:action="@{/logout}" method="post" class="m-0"><button type="submit" class="btn btn-sm" style="background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:6px"><i class="fas fa-sign-out-alt"></i></button></form></div></div></div>
<div class="main-content">
<div class="page-title"><h1><i class="fas fa-info-circle me-2"></i>图书详情</h1></div>
<div class="card-custom p-4" th:object="${book}"><div class="row"><div class="col-md-3 text-center"><div style="height:200px;background:#e8eaf6;border-radius:8px;display:flex;align-items:center;justify-content:center"><i class="fas fa-book" style="font-size:4rem;color:#5c6bc0"></i></div></div><div class="col-md-9"><h3 th:text="${book.title}">书名</h3><p class="text-muted" th:text="'作者: '+${book.author}">作者</p><p><span th:if="${book.available>0}" class="badge-available">可借 ([[${book.available}]]/[[${book.quantity}]])</span><span th:unless="${book.available>0}" class="badge-unavailable">已借完</span></p><hr><div class="row"><div class="col-md-4"><small class="text-muted">ISBN</small><p th:text="${book.isbn}">ISBN</p></div><div class="col-md-4"><small class="text-muted">分类</small><p th:text="${book.category}">分类</p></div><div class="col-md-4"><small class="text-muted">出版社</small><p th:text="${book.publisher}">出版社</p></div><div class="col-md-3"><small class="text-muted">出版年份</small><p th:text="${book.publicationYear}">2024</p></div><div class="col-md-3"><small class="text-muted">页数</small><p th:text="${book.pages}">页数</p></div><div class="col-md-3"><small class="text-muted">语种</small><p th:text="${book.language}">中文</p></div><div class="col-md-3"><small class="text-muted">索书号</small><p th:text="${book.callNumber}">索书号</p></div></div><hr><h6>内容简介</h6><p th:text="${book.description}" class="text-muted">描述</p><a href="/books" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i>返回</a></div></div></div>
</div>
<footer style="margin-top:40px;padding:16px 0;text-align:center;color:#999;font-size:0.85rem;border-top:1px solid #e0e0e0"><p>&copy; 2026 图书馆管理系统</p></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script></body></html>
