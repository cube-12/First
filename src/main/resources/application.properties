spring.application.name=LibrarySystem
server.port=8080

# ???????
# MySQL ????? URL
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?useSSL=false&serverTimezone=UTC
# ??????
spring.datasource.username=root
spring.datasource.password=123456

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ????
server.error.whitelabel.enabled=false
server.error.path=/error
# ????????DispatcherServlet
spring.mvc.servlet.load-on-startup=1
# ??Gzip??
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024
# ??????????????


# ?? JTA ????
spring.jpa.properties.hibernate.transaction.jta.platform=none
# ?? Open-in-view
spring.jpa.open-in-view=false
# ??????
logging.level.com.example.librarysystem=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ??????
spring.jpa.properties.hibernate.use_sql_comments=true

server.error.include-stacktrace=always
server.error.include-message=always
